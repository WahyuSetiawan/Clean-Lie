---
name: Test

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test + vet + format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAGS: desktop,production,webkit2_41
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: juragankoding-cachix
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: go test
        run: nix develop --command go test -tags "$TAGS" ./...

      - name: go vet
        run: nix develop --command go vet -tags "$TAGS" ./...

      - name: gofmt
        run: |
          set -euo pipefail
          # shellHook devShell menulis banner ke stdout; buang baris non-.go.
          out=$(nix develop --command gofmt -l .)
          files=$(printf '%s\n' "$out" | grep -E '\.go$' || true)
          if [ -n "$files" ]; then
            echo "::error::File Go belum diformat:"
            echo "$files"
            exit 1
          fi
  ui:
    name: UI smoke (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/test/package-lock.json

      - run: npm ci
      - run: npm test

  build:
    name: Nix build
    runs-on: ubuntu-latest
    needs: [go, ui]
    timeout-minutes: 60
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: juragankoding-cachix
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Build cleanlie
        run: nix build --print-build-logs .#cleanlie
